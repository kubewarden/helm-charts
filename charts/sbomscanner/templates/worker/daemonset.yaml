{{- if .Values.controller.nodeScan.enabled }}
{{- $ctx := dict "root" $ "workload" "workerNode" "component" "worker-node" }}
{{- $w := .Values.workerNode }}
{{- $image := .Values.worker.image }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "sbomscanner.fullname" . }}-worker-node
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  {{- include "sbomscanner.workloadLabels" $ctx | nindent 2 }}
  {{- with include "sbomscanner.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  selector:
    matchLabels:
      {{ include "sbomscanner.selectorLabels" .| nindent 6 }}
      app.kubernetes.io/component: worker-node
  template:
    metadata:
      {{- include "sbomscanner.podLabels" $ctx | nindent 6 }}
      {{- with include "sbomscanner.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      serviceAccountName: {{ include "sbomscanner.fullname" . }}-worker-node
      {{- with include "sbomscanner.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with $w.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init
          image: '{{ template "system_default_registry" $ctx }}{{ $image.repository }}:{{ $image.tag }}'
          imagePullPolicy: {{ include "sbomscanner.imagePullPolicy" $ctx }}
          # The init container does not need root, so it keeps a fixed restricted context.
          securityContext:
            {{ include "sbomscanner.securityContext" . | nindent 12 }}
          args:
            - --init
            - -nats-url
            - {{ .Release.Name }}-nats.{{ include "sbomscanner.namespace" . }}.svc.cluster.local:4222
            {{- with include "sbomscanner.logLevel" $ctx }}
            - -log-level={{ . }}
            {{- end }}
          {{- with include "sbomscanner.extraEnv" $ctx }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with include "sbomscanner.extraEnvFrom" $ctx }}{{ . | nindent 10 }}{{ end }}
          volumeMounts:
            - mountPath: "/nats/tls"
              name: nats-tls
              readOnly: true
            {{- with include "sbomscanner.extraVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
      containers:
        - name: worker
          image: '{{ template "system_default_registry" $ctx }}{{ $image.repository }}:{{ $image.tag }}'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with include "sbomscanner.otelEnv" $ctx }}
            {{- . | nindent 12 }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- with include "sbomscanner.extraEnv" $ctx }}{{ . | nindent 12 }}{{ end }}
          {{- with include "sbomscanner.extraEnvFrom" $ctx }}{{ . | nindent 10 }}{{ end }}
          imagePullPolicy: {{ include "sbomscanner.imagePullPolicy" $ctx }}
          {{- with $w.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - -nats-url
            - {{ .Release.Name }}-nats.{{ include "sbomscanner.namespace" . }}.svc.cluster.local:4222
            {{- if .Values.worker.trivyDBRepository }}
            - -trivy-db-repository={{ .Values.worker.trivyDBRepository | quote }}
            {{- end }}
            {{- if .Values.worker.trivyJavaDBRepository }}
            - -trivy-java-db-repository={{ .Values.worker.trivyJavaDBRepository | quote }}
            {{- end }}
            - -installation-namespace={{ include "sbomscanner.namespace" . }}
            {{- with include "sbomscanner.logLevel" $ctx }}
            - -log-level={{ . }}
            {{- end }}
            - -mode=node
            - -node-name=$(NODE_NAME)
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: None
            - mountPath: /var/run/worker
              name: run-volume
            - mountPath: /tmp
              name: tmp-dir
            - mountPath: "/nats/tls"
              name: nats-tls
              readOnly: true
            {{- with include "sbomscanner.otelVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
            {{- with include "sbomscanner.extraVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
      volumes:
        {{- with include "sbomscanner.otelVolumes" $ctx }}{{ . | nindent 8 }}{{ end }}
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: run-volume
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}
        - name: nats-tls
          secret:
            secretName: {{ include "sbomscanner.fullname" . }}-nats-worker-client-tls
        {{- with include "sbomscanner.extraVolumes" $ctx }}{{ . | nindent 8 }}{{ end }}
{{- end }}
