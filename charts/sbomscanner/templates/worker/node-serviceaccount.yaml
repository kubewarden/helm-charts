{{- if .Values.controller.nodeScan.enabled }}
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ include "sbomscanner.fullname" . }}-worker-node
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  labels:
    {{ include "sbomscanner.labels" .| nindent 4 }}
    app.kubernetes.io/component: worker-node
  {{- with include "sbomscanner.serviceAccountAnnotations" (dict "root" $ "workload" "workerNode" "component" "worker-node") }}{{ . | nindent 2 }}{{ end }}
{{- end }}
