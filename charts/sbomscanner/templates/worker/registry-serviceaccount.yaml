kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ include "sbomscanner.fullname" . }}-worker
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  labels:
    {{ include "sbomscanner.labels" .| nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with include "sbomscanner.serviceAccountAnnotations" (dict "root" $ "workload" "worker" "component" "worker") }}{{ . | nindent 2 }}{{ end }}
