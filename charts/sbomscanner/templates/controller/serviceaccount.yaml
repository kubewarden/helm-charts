apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sbomscanner.fullname" . }}-controller
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  labels:
    {{ include "sbomscanner.labels" .| nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with include "sbomscanner.serviceAccountAnnotations" (dict "root" $ "workload" "controller" "component" "controller") }}{{ . | nindent 2 }}{{ end }}
