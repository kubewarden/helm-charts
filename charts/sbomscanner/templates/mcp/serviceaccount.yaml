{{- if .Values.mcp.enabled }}
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ include "sbomscanner.fullname" . }}-mcp
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  labels:
    {{ include "sbomscanner.labels" .| nindent 4 }}
    app.kubernetes.io/component: mcp
  {{- with include "sbomscanner.serviceAccountAnnotations" (dict "root" $ "workload" "mcp" "component" "mcp") }}{{ . | nindent 2 }}{{ end }}
{{- end }}
