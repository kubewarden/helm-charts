{{- with .Values.storage.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sbomscanner.fullname" $ }}-storage
  namespace: {{ include "sbomscanner.namespace" $ | quote }}
  labels:
    {{- include "sbomscanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  {{- if hasKey . "minAvailable" }}
  minAvailable: {{ .minAvailable }}
  {{- end }}
  {{- if hasKey . "maxUnavailable" }}
  maxUnavailable: {{ .maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sbomscanner.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: storage
{{- end }}
