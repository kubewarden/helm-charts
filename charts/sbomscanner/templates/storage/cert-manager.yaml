apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "sbomscanner.fullname" . }}-storage-issuer
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  labels:
    {{- include "sbomscanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "sbomscanner.fullname" . }}-storage-tls
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  labels:
    {{- include "sbomscanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  secretName: {{ include "sbomscanner.fullname" . }}-storage-tls
  dnsNames:
    - {{ include "sbomscanner.fullname" . }}-storage.{{ include "sbomscanner.namespace" . }}.svc
    - {{ include "sbomscanner.fullname" . }}-storage.{{ include "sbomscanner.namespace" . }}.svc.cluster.local
  privateKey:
    rotationPolicy: Always
  issuerRef:
    kind: Issuer
    name: {{ include "sbomscanner.fullname" . }}-storage-issuer
