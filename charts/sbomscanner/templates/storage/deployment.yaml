{{- $ctx := dict "root" $ "workload" "storage" "component" "storage" }}
{{- $w := .Values.storage }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbomscanner.fullname" . }}-storage
  namespace: {{ include "sbomscanner.namespace" . | quote }}
  {{- include "sbomscanner.workloadLabels" $ctx | nindent 2 }}
  {{- with include "sbomscanner.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      {{ include "sbomscanner.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: storage
  template:
    metadata:
      {{- include "sbomscanner.podLabels" $ctx | nindent 6 }}
      {{- with include "sbomscanner.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      serviceAccountName: {{ include "sbomscanner.fullname" . }}-storage
      {{- with include "sbomscanner.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "sbomscanner.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with $w.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init
          image: '{{ template "system_default_registry" $ctx }}{{ $w.image.repository }}:{{ $w.image.tag }}'
          imagePullPolicy: {{ include "sbomscanner.imagePullPolicy" $ctx }}
          {{- with $w.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --init
            - -nats-url
            - {{ .Release.Name }}-nats.{{ include "sbomscanner.namespace" . }}.svc.cluster.local:4222
            {{- with include "sbomscanner.logLevel" $ctx }}
            - -log-level={{ . }}
            {{- end }}
          {{- with include "sbomscanner.extraEnv" $ctx }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with include "sbomscanner.extraEnvFrom" $ctx }}{{ . | nindent 10 }}{{ end }}
          volumeMounts:
            - name: pg-secret
              mountPath: /pg
              readOnly: true
            - name: pg-server-ca
              mountPath: /pg/tls/server/
              readOnly: true
            - mountPath: "/nats/tls"
              name: nats-tls
              readOnly: true
            {{- with include "sbomscanner.extraVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
      containers:
        - name: storage
          image: '{{ template "system_default_registry" $ctx }}{{ $w.image.repository }}:{{ $w.image.tag }}'
          {{- with $w.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $otelEnv := include "sbomscanner.otelEnv" $ctx }}
          {{- $extraEnv := include "sbomscanner.extraEnv" $ctx }}
          {{- if or $otelEnv $extraEnv }}
          env:
            {{- with $otelEnv }}{{ . | nindent 12 }}{{ end }}
            {{- with $extraEnv }}{{ . | nindent 12 }}{{ end }}
          {{- end }}
          {{- with include "sbomscanner.extraEnvFrom" $ctx }}{{ . | nindent 10 }}{{ end }}
          args:
            - -nats-url
            - {{ .Release.Name }}-nats.{{ include "sbomscanner.namespace" . }}.svc.cluster.local:4222
            - -service-account-namespace
            - {{ include "sbomscanner.namespace" . | quote }}
            - -service-account-name
            - {{ include "sbomscanner.fullname" . }}-controller
            {{- with include "sbomscanner.logLevel" $ctx }}
            - -log-level={{ . }}
            {{- end }}
          imagePullPolicy: {{ include "sbomscanner.imagePullPolicy" $ctx }}
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: storage-tls
              mountPath: /tls
            - name: pg-secret
              mountPath: /pg
              readOnly: true
            - name: pg-server-ca
              mountPath: /pg/tls/server/
              readOnly: true
            - mountPath: "/nats/tls"
              name: nats-tls
              readOnly: true
            {{- with include "sbomscanner.otelVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
            {{- with include "sbomscanner.extraVolumeMounts" $ctx }}{{ . | nindent 12 }}{{ end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: 443
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /readyz
              port: 443
              scheme: HTTPS
      volumes:
        {{- with include "sbomscanner.otelVolumes" $ctx }}{{ . | nindent 8 }}{{ end }}
        - name: storage-tls
          secret:
            secretName: {{ include "sbomscanner.fullname" . }}-storage-tls
        - name: pg-secret
          secret:
            {{- if $w.postgres.cnpg.enabled }}
            secretName: {{ include "sbomscanner.fullname" . }}-cnpg-cluster-app
            {{- else }}
            secretName: {{ $w.postgres.authSecretName }}
            {{- end }}
        - name: pg-server-ca
          secret:
            {{- if $w.postgres.cnpg.enabled }}
            secretName: {{ include "sbomscanner.fullname" . }}-cnpg-cluster-ca
            {{- else }}
            secretName: {{ $w.postgres.caSecretName }}
            {{- end }}
            items:
            - key: ca.crt
              path: ca.crt
        - name: nats-tls
          secret:
            secretName: {{ include "sbomscanner.fullname" . }}-nats-worker-client-tls
        {{- with include "sbomscanner.extraVolumes" $ctx }}{{ . | nindent 8 }}{{ end }}
