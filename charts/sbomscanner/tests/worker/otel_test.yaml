suite: "Worker OTel Tests"
templates:
  - "templates/worker/deployment.yaml"
  - "templates/worker/daemonset.yaml"
tests:
  - it: "should not render any OTel configuration when the endpoint is empty"
    asserts:
      - notExists:
          path: "spec.template.spec.volumes[?(@.name == 'otel-ca')]"

  - it: "should render the OTLP endpoint and the pod identity when the endpoint is set"
    set:
      otel:
        endpoint: "http://otel-collector:4317"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector:4317"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: K8S_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: "should keep the node name on the daemonset"
    template: "templates/worker/daemonset.yaml"
    set:
      otel:
        endpoint: "http://otel-collector:4317"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  - it: "should mount the TLS secrets and point the certificate env vars at them"
    set:
      otel:
        endpoint: "https://otel-collector:4317"
        caSecretName: "otel-ca-secret"
        clientCertificateSecretName: "otel-client-secret"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: /otel/tls/ca/ca.crt
      - contains:
          path: "spec.template.spec.containers[0].volumeMounts"
          content:
            name: otel-client-tls
            mountPath: /otel/tls/client
            readOnly: true
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-ca
            secret:
              secretName: otel-ca-secret
