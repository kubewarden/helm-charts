suite: "CNPG Tests"
templates:
  - "templates/storage/cnpg.yaml"
tests:
  - it: "should not render any resources when CNPG is disabled"
    set:
      storage:
        postgres:
          cnpg:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "should render correct Cluster configuration when CNPG is enabled"
    release:
      name: test-release
      namespace: test-namespace
    set:
      storage:
        postgres:
          cnpg:
            enabled: true
            instances: 5
            storage:
              size: 2Gi
              resizeInUseVolumes: false
              storageClass: "fast-ssd"
              pvcTemplate:
                metadata:
                  labels:
                    custom: label
    asserts:
      - equal:
          path: "spec.instances"
          value: 5
      - equal:
          path: "spec.storage.size"
          value: "2Gi"
      - equal:
          path: "spec.storage.resizeInUseVolumes"
          value: false
      - equal:
          path: "spec.storage.storageClass"
          value: "fast-ssd"
      - equal:
          path: "spec.storage.pvcTemplate.metadata.labels.custom"
          value: "label"
      - notExists:
          path: "spec.imageName"

  - it: "should render imageName when set"
    set:
      storage:
        postgres:
          cnpg:
            enabled: true
            imageName: "my-registry.example.com/postgresql:18.1"
    asserts:
      - equal:
          path: "spec.imageName"
          value: "my-registry.example.com/postgresql:18.1"

  - it: "should not render storageClass or merged fields by default"
    set:
      storage:
        postgres:
          cnpg:
            enabled: true
    asserts:
      - notExists:
          path: "spec.storage.storageClass"
      - notExists:
          path: "spec.backup"
      - notExists:
          path: "spec.plugins"

  - it: "should deep-merge extra spec fields without clobbering chart-managed ones"
    set:
      storage:
        postgres:
          cnpg:
            enabled: true
            instances: 2
            storage:
              size: 5Gi
            merge:
              plugins:
                - name: barman-cloud.cloudnative-pg.io
                  isWALArchiver: true
                  parameters:
                    barmanObjectName: my-object-store
              backup:
                target: "prefer-standby"
              postgresql:
                parameters:
                  max_connections: "200"
    asserts:
      - equal:
          path: "spec.instances"
          value: 2
      - equal:
          path: "spec.storage.size"
          value: "5Gi"
      - equal:
          path: "spec.storage.resizeInUseVolumes"
          value: true
      - equal:
          path: "spec.plugins[0].name"
          value: "barman-cloud.cloudnative-pg.io"
      - equal:
          path: "spec.plugins[0].parameters.barmanObjectName"
          value: "my-object-store"
      - equal:
          path: "spec.backup.target"
          value: "prefer-standby"
      - equal:
          path: "spec.postgresql.parameters.max_connections"
          value: "200"

  - it: "should let merge override chart-managed fields"
    set:
      storage:
        postgres:
          cnpg:
            enabled: true
            instances: 3
            storage:
              size: 1Gi
            merge:
              instances: 7
              storage:
                size: 20Gi
    asserts:
      - equal:
          path: "spec.instances"
          value: 7
      - equal:
          path: "spec.storage.size"
          value: "20Gi"
      - equal:
          path: "spec.storage.resizeInUseVolumes"
          value: true


