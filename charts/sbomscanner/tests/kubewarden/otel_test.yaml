suite: "Values contract: telemetry"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/storage/deployment.yaml"
  - "templates/worker/deployment.yaml"
  - "templates/worker/daemonset.yaml"
tests:
  - it: "should render global.otel on every instrumented workload"
    set:
      global:
        otel:
          endpoint: "https://otel-collector:4317"
          caSecretName: "otel-ca-secret"
          clientCertificateSecretName: "otel-client-secret"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://otel-collector:4317"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: /otel/tls/ca/ca.crt
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
            value: /otel/tls/client/tls.crt
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_CLIENT_KEY
            value: /otel/tls/client/tls.key
      - contains:
          path: "spec.template.spec.containers[0].volumeMounts"
          content:
            name: otel-ca
            mountPath: /otel/tls/ca
            readOnly: true
      - contains:
          path: "spec.template.spec.containers[0].volumeMounts"
          content:
            name: otel-client-tls
            mountPath: /otel/tls/client
            readOnly: true
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-ca
            secret:
              secretName: otel-ca-secret
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-client-tls
            secret:
              secretName: otel-client-secret

  - it: "should render each workload otel block on its own workload"
    set:
      controller:
        otel:
          endpoint: "http://controller:4317"
      storage:
        otel:
          endpoint: "http://storage:4317"
      worker:
        otel:
          endpoint: "http://worker:4317"
      workerNode:
        otel:
          endpoint: "http://worker-node:4317"
          caSecretName: "node-ca-secret"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://controller:4317"
        template: "templates/controller/deployment.yaml"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://storage:4317"
        template: "templates/storage/deployment.yaml"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://worker:4317"
        template: "templates/worker/deployment.yaml"
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://worker-node:4317"
        template: "templates/worker/daemonset.yaml"
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-ca
            secret:
              secretName: node-ca-secret
        template: "templates/worker/daemonset.yaml"
      - notContains:
          path: "spec.template.spec.volumes"
          content:
            name: otel-ca
            secret:
              secretName: node-ca-secret
        template: "templates/worker/deployment.yaml"
