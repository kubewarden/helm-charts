suite: "Values contract: ServiceAccounts"
templates:
  - "templates/controller/serviceaccount.yaml"
  - "templates/storage/serviceaccount.yaml"
  - "templates/worker/registry-serviceaccount.yaml"
  - "templates/worker/node-serviceaccount.yaml"
  - "templates/mcp/serviceaccount.yaml"
set:
  mcp:
    enabled: true
    auth:
      secretName: x
tests:
  - it: "should render global.serviceAccount.annotations on every ServiceAccount"
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: scanner
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: scanner
