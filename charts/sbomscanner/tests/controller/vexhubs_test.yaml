suite: "Controller Default VEXHubs Tests"
templates:
  - "templates/controller/vexhubs.yaml"
tests:
  - it: "should render the rancher and aquasecurity VEXHubs by default"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: VEXHub
      - equal:
          path: "metadata.name"
          value: "rancher"
        documentIndex: 0
      - equal:
          path: "spec.url"
          value: "https://github.com/rancher/vexhub"
        documentIndex: 0
      - equal:
          path: "metadata.name"
          value: "aquasecurity"
        documentIndex: 1
      - equal:
          path: "spec.url"
          value: "https://github.com/aquasecurity/vexhub"
        documentIndex: 1

  - it: "should render no VEXHubs when controller.defaultVEXHubResources is false"
    set:
      controller:
        defaultVEXHubResources: false
    asserts:
      - hasDocuments:
          count: 0
