# This is a Rancher questions file
---
questions:
  ###############################################################################
  # General
  ###############################################################################
  - variable: global.imagePullPolicy
    label: Image Pull Policy
    type: enum
    default: IfNotPresent
    options:
      - Always
      - IfNotPresent
      - Never
    group: General
    description: |
      Pull policy of all SBOMscanner workloads

  - variable: global.logLevel
    label: Log Level
    type: enum
    default: info
    options:
      - debug
      - info
      - warn
      - error
    group: General
    description: |
      Log level of all SBOMscanner workloads

  ###############################################################################
  # Controller
  ###############################################################################
  - variable: controller.replicas
    label: Controller Replicas
    type: int
    default: 3
    min: 1
    group: Controller
    description: |
      Number of replicas of the Controller Deployment

  - variable: controller.defaultVEXHubResources
    label: Install Default VEXHub Resources
    type: boolean
    default: true
    group: Controller
    description: |
      Seed default VEXHub resources.

  ###############################################################################
  # Worker
  ###############################################################################
  - variable: worker.replicas
    label: Worker Replicas
    type: int
    default: 3
    min: 1
    group: Worker
    description: |
      Number of replicas of the Worker Deployment

  - variable: worker.trivyDBRepository
    label: Worker Trivy DB Repository
    type: string
    default: public.ecr.aws/aquasecurity/trivy-db
    group: Worker
    description: |
      OCI repository to retrieve trivy-db

  - variable: worker.trivyJavaDBRepository
    label: Worker Trivy Java DB Repository
    type: string
    default: public.ecr.aws/aquasecurity/trivy-java-db
    group: Worker
    description: |
      OCI repository to retrieve trivy-java-db

  ###############################################################################
  # Storage
  ###############################################################################
  - variable: storage.replicas
    label: Storage Replicas
    type: int
    default: 3
    min: 1
    group: Storage
    description: |
      Number of replicas of the Storage Deployment

  - variable: storage.postgres.authSecretName
    label: Authentication Secret Name
    type: string
    default: ""
    group: Storage
    description: |
      Name of existing secret containing the URI to connect to external Postgres

  - variable: storage.postgres.caSecretName
    label: CA Secret Name
    type: string
    default: ""
    group: Storage
    description: |
      Name of secret containing the CA certificate used to verify the Postgres server certificate

  - variable: storage.postgres.cnpg.enabled
    label: CNPG Enabled
    type: boolean
    default: true
    group: Storage

  - variable: storage.postgres.cnpg.instances
    label: CNPG Instances
    type: int
    default: 3
    group: Storage

  - variable: storage.postgres.cnpg.storage.size
    label: CNPG Storage Size
    type: string
    default: "1Gi"
    group: Storage
    description: |
      Size of the storage

  - variable: storage.postgres.cnpg.storage.resizeInUseVolumes
    label: CNPG Storage Resize In-Use-Volumes
    type: boolean
    default: true
    group: Storage
    description: |
      Resize existent PVCs

  - variable: storage.postgres.cnpg.storage.storageClass
    label: CNPG StorageClass
    type: string
    default: ""
    group: Storage
    description: |
      StorageClass to use for PVCs

  ###############################################################################
  # OpenTelemetry
  ###############################################################################
  - variable: global.otel.endpoint
    label: OpenTelemetry OTLP Endpoint
    type: string
    default: ""
    group: OpenTelemetry
    description: |
      OTLP gRPC endpoint to export telemetry to, e.g. http://otel-collector:4317
      (plaintext) or https://otel-collector:4317 (TLS). Leave empty to disable
      telemetry export.

  - variable: global.otel.caSecretName
    label: OpenTelemetry Collector CA Secret
    type: string
    default: ""
    group: OpenTelemetry
    description: |
      Name of secret containing the CA certificate used to verify the collector
      server certificate. The secret must contain a `ca.crt` key.

  - variable: global.otel.clientCertificateSecretName
    label: OpenTelemetry Client Certificate Secret
    type: string
    default: ""
    group: OpenTelemetry
    description: |
      Name of secret containing the client certificate and key used to
      authenticate to the collector (mTLS). The secret must contain `tls.crt`
      and `tls.key` keys.
