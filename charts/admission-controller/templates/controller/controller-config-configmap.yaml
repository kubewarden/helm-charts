apiVersion: v1
kind: ConfigMap
metadata:
  name: kubewarden-controller-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "admission-controller.labels" . | nindent 4 }}
  annotations:
    {{- include "admission-controller.annotations" . | nindent 4 }}
data:
  # config.yaml holds the controller configuration as a YAML object.
  # Keys:
  # - namespacedPoliciesAllowedResources: the list of resources that
  #   namespaced policies can target. The controller rejects every
  #   namespaced policy when this list is empty.
  config.yaml: |
    {{- toYaml (dict "namespacedPoliciesAllowedResources" (default (list) .Values.namespacedPoliciesAllowedResources)) | nindent 4 }}
