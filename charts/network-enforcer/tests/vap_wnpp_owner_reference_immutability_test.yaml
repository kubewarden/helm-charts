suite: "Verify WNPP owner-reference immutability ValidatingAdmissionPolicy"
templates:
  - templates/vap/wnpp-owner-reference-immutability.yaml
chart:
  version: 1.0.0
  appVersion: 2.0.0
release:
  name: my-release
  namespace: my-namespace
tests:
  - it: "renders VAP and binding"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: my-release-network-enforcer-wnpp-owner-reference-immutability
        documentIndex: 0
      - equal:
          path: metadata.name
          value: my-release-network-enforcer-wnpp-owner-reference-immutability-binding
        documentIndex: 1
