suite: "PriorityClass Tests"
templates:
  - "templates/priorityclass/priorityclass.yaml"

tests:
  - it: "should render PriorityClass with defaults"
    set: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PriorityClass
      - equal:
          path: metadata.name
          value: network-enforcer-priorityclass
      - equal:
          path: value
          value: 1000000
      - equal:
          path: globalDefault
          value: false
      - equal:
          path: description
          value: PriorityClass for network-enforcer controller, fluent-bit and otel-collector pods.

  - it: "should not render PriorityClass when disabled"
    set:
      priorityClass:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "should not render PriorityClass when name is empty"
    set:
      priorityClass:
        name: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: "should allow name and value override"
    set:
      priorityClass:
        name: custom-priorityclass
        value: 500000
    asserts:
      - equal:
          path: metadata.name
          value: custom-priorityclass
      - equal:
          path: value
          value: 500000
