{{- if eq .Values.controller.provider.name "istio" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: istio-fluent-bit
    {{- include "network-enforcer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: istio-fluent-bit
      {{- include "network-enforcer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: istio-fluent-bit
        {{- include "network-enforcer.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/istio-fluent-bit/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- include "network-enforcer.imagePullSecrets" .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          {{- with .Values.controller.provider.istio.fluentBit.image }}
          image: {{ .repository }}:{{ .tag }}
          imagePullPolicy: {{ .pullPolicy }}
          {{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/scripts/ztunnel_to_otel.lua
              subPath: ztunnel_to_otel.lua
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: state
              mountPath: /fluent-bit/state
            {{- $tlsMounts := include "network-enforcer.istio.fluentBit.tls.volumeMounts" . | trim }}
            {{- if $tlsMounts }}
            {{- $tlsMounts | nindent 12 }}
            {{- end }}
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: {{ include "network-enforcer.fullname" . }}-istio-fluent-bit
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: state
          emptyDir: {}
        {{- $tlsVolumes := include "network-enforcer.istio.fluentBit.tls.volumes" . | trim }}
        {{- if $tlsVolumes }}
        {{- $tlsVolumes | nindent 8 }}
        {{- end }}
{{- end }}
