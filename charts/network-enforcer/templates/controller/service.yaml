apiVersion: v1
kind: Service
metadata:
  name: {{ include "network-enforcer.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "network-enforcer.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    {{- include "network-enforcer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
