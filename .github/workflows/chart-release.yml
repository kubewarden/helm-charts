name: Chart release

# Reusable workflow, called only by helm-chart-release.yml in this repository.
# Packages one Helm chart from this repository, pushes it to ghcr.io, signs it
# with cosign, and attests it with `actions/attest`.
#
# Why a reusable workflow and not steps in helm-chart-release.yml:
# a reusable workflow runs as its own job, with its own OIDC token. The token
# names this file in `job_workflow_ref`. `actions/attest` writes the SLSA
# provenance from that token. A step in the calling job cannot forge it, and
# the calling job cannot add steps to this one. The only way in is the inputs
# below. That is what moves the charts from SLSA Build L2 to L3.
#
# The chart is packaged here, not in the caller. The caller only names a
# directory. This job checks out the current commit and runs `helm package` on
# that directory. So the attested `.tgz` is the one that `helm package`
# produces from the commit recorded in the provenance, and nothing in the
# calling workflow can swap it. A workflow that attested a caller-built file
# would only prove who uploaded it, not how it was built.
#
# Chart dependencies are build dependencies, like base images are for a
# container build: they come from the repositories named in Chart.yaml, at
# the versions pinned in Chart.lock. The SLSA Build track does not cover them.
#
# Identity of every signature and attestation this workflow produces:
#   https://github.com/kubewarden/helm-charts/.github/workflows/chart-release.yml@<ref>
#
# The caller keeps the GitHub release and the Helm repository index, because
# those steps are not repeatable. To attach the same bytes that were attested,
# the caller downloads the workflow artifact named in the `artifact-name`
# output and checks it against the `.sha256` file next to the chart.

# No default token permissions. Each job declares exactly what it needs.
permissions: {}

on:
  workflow_call:
    inputs:
      chart-path:
        description: |
          Path of the chart directory in this repository, for example
          `charts/admission-controller`. The directory must hold a
          `Chart.yaml`. If the chart has dependencies, it must also hold a
          `Chart.lock`; the workflow fetches them at the locked versions from
          the repositories named in `Chart.yaml`.
        required: true
        type: string
      oci-repository:
        description: |
          OCI repository to push to, without the chart name. The chart goes
          to `oci://<oci-repository>/<chart-name>:<chart-version>`. Defaults
          to `ghcr.io/<owner>/charts`.
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: Digest of the pushed chart in the OCI registry.
        value: ${{ jobs.publish.outputs.digest }}
      chart-name:
        description: Name of the pushed chart, from `Chart.yaml`.
        value: ${{ jobs.publish.outputs.chart-name }}
      chart-version:
        description: Version of the pushed chart, from `Chart.yaml`.
        value: ${{ jobs.publish.outputs.chart-version }}
      artifact-name:
        description: |
          Name of the workflow artifact that holds the packaged
          `<chart-name>-<chart-version>.tgz` and its `.sha256` file.
        value: ${{ jobs.publish.outputs.artifact-name }}
      tgz-sha256:
        description: SHA-256 of the packaged `.tgz` file.
        value: ${{ jobs.publish.outputs.tgz-sha256 }}

env:
  SIGNER_IDENTITY_REGEXP: '^https://github\.com/kubewarden/helm-charts/\.github/workflows/chart-release\.yml@'
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  publish:
    name: Package, push, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout this repository
      packages: write # Push the chart and the attestation referrer to ghcr.io
      id-token: write # Sign with cosign, attest with actions/attest
      attestations: write # actions/attest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      chart-name: ${{ steps.package.outputs.chart-name }}
      chart-version: ${{ steps.package.outputs.chart-version }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      tgz-sha256: ${{ steps.package.outputs.tgz-sha256 }}
    steps:
      - name: Checkout
        # In a reusable workflow, checkout defaults to the caller's repository
        # and ref: this repository, at the commit that triggered the release.
        # That is the commit the provenance records, and the one we package
        # the chart from.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package the chart
        id: package
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          OUT_DIR: ${{ runner.temp }}/chart
        run: |
          set -euo pipefail

          # The path must stay inside the checkout and name a chart.
          case "${CHART_PATH}" in
            /*|*..*)
              echo "Error: chart-path must be a relative path with no '..': ${CHART_PATH}"
              exit 1
              ;;
          esac
          if [ ! -f "${CHART_PATH}/Chart.yaml" ]; then
            echo "Error: no Chart.yaml in ${CHART_PATH}"
            exit 1
          fi

          chart_name=$(helm show chart "${CHART_PATH}" | yq -r '.name')
          chart_version=$(helm show chart "${CHART_PATH}" | yq -r '.version')

          # Fetch the chart dependencies at the versions pinned in Chart.lock.
          # `helm dependency build` needs every HTTP repository in Chart.yaml
          # to be registered first, even when the tarballs are already
          # vendored under charts/. Register them here so the caller does
          # not have to. OCI and file:// repositories need no registration.
          # `helm dependency build` fails if Chart.lock is out of date.
          if [ -f "${CHART_PATH}/Chart.lock" ]; then
            i=0
            while IFS= read -r repo; do
              [ -n "$repo" ] || continue
              i=$((i + 1))
              helm repo add --force-update "chart-dep-${i}" "$repo"
            done < <(yq -r '.dependencies[]?.repository // "" | select(test("^https?://"))' "${CHART_PATH}/Chart.yaml" | sort -u)
            helm dependency build "${CHART_PATH}"
          fi

          mkdir -p "${OUT_DIR}"
          helm package "${CHART_PATH}" --destination "${OUT_DIR}"

          tgz="${OUT_DIR}/${chart_name}-${chart_version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "Error: helm package did not produce ${tgz}"
            ls -la "${OUT_DIR}"
            exit 1
          fi
          (cd "${OUT_DIR}" && sha256sum "${chart_name}-${chart_version}.tgz" > "${chart_name}-${chart_version}.tgz.sha256")
          tgz_sha256=$(cut -d' ' -f1 "${tgz}.sha256")

          {
            echo "chart-name=${chart_name}"
            echo "chart-version=${chart_version}"
            echo "tgz=${tgz}"
            echo "tgz-sha256=${tgz_sha256}"
            echo "artifact-name=chart-${chart_name}-${chart_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the chart to ghcr.io
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
          OCI_REPOSITORY: ${{ inputs.oci-repository }}
          CHART_NAME: ${{ steps.package.outputs.chart-name }}
          TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          set -euo pipefail
          registry="${OCI_REPOSITORY:-ghcr.io/${OWNER}/charts}"

          push_output=$(helm push "${TGZ}" "oci://${registry}" 2>&1)
          echo "$push_output"
          digest=$(echo "$push_output" | sed -n 's/.*Digest: \(sha256:[0-9a-f]*\).*/\1/p')
          if [ -z "$digest" ]; then
            echo "Error: the helm push output has no digest"
            exit 1
          fi

          {
            echo "digest=${digest}"
            echo "ref=${registry}/${CHART_NAME}"
          } >> "$GITHUB_OUTPUT"

      # Two signature formats. Some verifiers (slsactl, hauler, older cosign)
      # read only the v2 format. Newer cosign reads the v3 bundle format.
      # Each format is verified on its own below: `cosign verify` with the
      # new bundle format falls back to the legacy format when it finds no
      # bundle, so it cannot prove the v3 signature exists.
      - name: Sign the chart (cosign v2 signature format)
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${REF}@${DIGEST}"

      - name: Sign the chart (cosign v3 signature format)
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=true --use-signing-config=true \
            "${REF}@${DIGEST}"

      # `--new-bundle-format=false` disables the bundle lookup, so this
      # step only accepts the legacy signature from the step above.
      - name: Verify the chart signature (cosign v2 signature format)
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --new-bundle-format=false \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            --certificate-identity-regexp="${SIGNER_IDENTITY_REGEXP}" \
            "${REF}@${DIGEST}"

      # `cosign verify --new-bundle-format=true` would pass on the legacy
      # signature alone if the v3 bundle were missing, so it cannot prove
      # this format was pushed. `verify-attestation` has no such fallback:
      # with no bundle to read, it fails with "no matching attestations".
      - name: Verify the chart signature (cosign v3 signature format)
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify-attestation \
            --new-bundle-format=true \
            --type https://sigstore.dev/cosign/sign/v1 \
            --certificate-oidc-issuer="${OIDC_ISSUER}" \
            --certificate-identity-regexp="${SIGNER_IDENTITY_REGEXP}" \
            "${REF}@${DIGEST}"

      # This step gives the chart SLSA Build L3. See the header comment.
      - name: Attest build provenance (SLSA L3)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The caller attaches this file to the GitHub release. It is the same
      # file that was pushed and attested above; the caller checks it against
      # the `tgz-sha256` output (or the `.sha256` file next to it).
      - name: Upload the packaged chart as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            ${{ steps.package.outputs.tgz }}
            ${{ steps.package.outputs.tgz }}.sha256
          retention-days: 1
          if-no-files-found: error
