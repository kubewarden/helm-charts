# This action releases the kubewarden Helm charts.
# The action must run on each commit done against main, however
# a new release will be performed **only** when a chart has a version that
# is not yet in the Helm repository index.
#
# For each chart with a new version, this action will:
#   * Package the chart, push it to the ghcr.io OCI registry, sign it and
#     attest it. All of this runs inside the `chart-release.yml` reusable
#     workflow in this repository. That workflow checks out the current
#     commit and runs `helm package` itself, so the signature and the
#     attestation carry its identity and the chart reaches SLSA Build L3.
#     See the header of chart-release.yml for the reasoning.
#     This happens before the GitHub release is created: GitHub releases are
#     immutable and cannot be repaired on a re-run, while OCI pushes,
#     signatures and attestations can be repeated safely.
#   * Create a new GitHub release: e.g. admission-controller-1.2.3.
#   * This release has a admission-controller-1.2.3.tgz asset associated with
#     it. This is the same file that the reusable workflow pushed and
#     attested.
#   * Update the `index.yaml` file inside of the `gh-pages` branch. This is the
#     index of our https Helm chart repository, which we serve through GitHub pages.
#   * Update the docs shown at https://charts.kubewarden.io, on the `gh-pages`
#     branch. This is the README files of the chart(s), served also through
#     GitHub pages.
#
# = FAQ
#
# == Why don't we run this action only when a tag like `v*` is created?
#
# Running the action only when a "release tag" is created will not produce
# a helm chart. That happens because the code which determines if something
# changed inside of the `charts` directory will not find any changes.
#
# == Why do we still install `github.com/helm/chart-releaser`?
#
# Only to update the Helm repository index on gh-pages with `cr index`.
#
# The GitHub releases are created with `gh` instead of `cr upload`: this
# repository has immutable releases enabled, so all the assets (chart
# package, Hauler manifest and its cosign bundle) must be attached before
# the release is published. `gh release create` does this by creating a
# draft, uploading the assets, and only then publishing the release, while
# `cr upload` cannot attach extra assets
# (see https://github.com/helm/chart-releaser/pull/587).
#
# == Why three jobs?
#
# The packaging, the OCI push, the cosign signature and the `actions/attest`
# step run in a reusable workflow, so that they carry its identity and no
# step of this file can touch them. GitHub only lets a workflow call a
# reusable workflow at the job level. So this file finds the charts with a
# new version in one job, calls the reusable workflow once per chart in a
# second job, and creates the GitHub releases in a third job.
#
# == Why does the reusable workflow live in this repository?
#
# A reusable workflow gives SLSA Build L3 whether it lives here or in another
# repository: what matters is that it runs as its own job with its own OIDC
# token. Keeping it here means one repository to read and no cross-repository
# pin to bump. The container images use kubewarden/github-actions instead
# because four repositories share that builder.
#
# == Why does the release job not package the charts again?
#
# The GitHub release asset must be the same bytes that were pushed and
# attested. The reusable workflow uploads the packaged chart as a workflow
# artifact, and also attests the chart file itself, separately from the OCI
# push. The release job downloads the artifact and runs
# `gh attestation verify` on the chart file, checking it against this
# reusable workflow's identity and the commit digest. A workflow artifact
# can be replaced by any job in the run (`upload-artifact` supports
# `overwrite: true`), so a plain checksum file next to the chart would not
# be enough; the attestation is signed by the reusable workflow's own OIDC
# token, and no other job in the run can forge it.

name: Release helm chart

# No default token permissions. Each job declares exactly what it needs.
permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  plan:
    name: Find the charts with a new version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # JSON array of the chart names that have a new version, for example
      # '["admission-controller","sbomscanner"]'. Empty array when nothing
      # changed.
      charts: ${{ steps.plan.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the contents of common-values.yaml are included in values.yaml
        run: |
          make check-common-values

      - name: Find the charts with a new version
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          changed=()
          for chart in charts/*/; do
            chart=${chart%/}
            [ -f "${chart}/Chart.yaml" ] || continue
            chart_name=$(yq -r '.name' "${chart}/Chart.yaml")
            chart_version=$(yq -r '.version' "${chart}/Chart.yaml")

            # Skip the chart if its version is already in the Helm repository
            # index. The GitHub release existing is not enough: a previous run
            # may have published the release but failed before indexing it.
            # Everything up to `cr index` is safe to repeat for such a chart.
            if git show origin/gh-pages:index.yaml | \
                yq -r ".entries.\"${chart_name}\"[]?.version" | grep -qx "${chart_version}"; then
              echo "Chart ${chart_name}-${chart_version} already released and indexed. No need to release again."
              continue
            fi

            echo "Chart ${chart_name}-${chart_version} has a new version."
            changed+=("$chart_name")
          done

          # Hand the list of changed charts to the publish job as a JSON array.
          if [ ${#changed[@]} -eq 0 ]; then
            echo 'charts=[]' >> "$GITHUB_OUTPUT"
          else
            echo "charts=$(jq -c -n '$ARGS.positional' --args "${changed[@]}")" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Package, push, sign and attest ${{ matrix.chart }}
    needs: [plan]
    if: needs.plan.outputs.charts != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.plan.outputs.charts) }}
    permissions:
      contents: read # Checkout this repository
      packages: write # Push the chart and the attestation referrer to ghcr.io
      id-token: write # Sign with cosign, attest with actions/attest
      attestations: write # actions/attest
    # The local reusable workflow. A `uses: ./...` reference always runs the
    # file from the same commit as this workflow.
    uses: ./.github/workflows/chart-release.yml
    with:
      chart-path: charts/${{ matrix.chart }}

  release:
    name: Create the GitHub releases and update the index
    needs: [plan, publish]
    # Run when every matrix leg of publish succeeded, or when publish was
    # skipped because no chart changed: the gh-pages README and
    # artifacthub-repo.yml must be updated on every push. Never run after a
    # failure or a cancellation: a cancelled matrix may have published only
    # some of the charts, and GitHub releases are immutable.
    if: "!cancelled() && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign sign-blob on the Hauler manifest
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `cr index --push` commits to a worktree of this checkout with
      # `git commit --signoff`, so the identity must exist before it runs.
      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      # One artifact per chart, named `chart-<name>-<version>`, uploaded by
      # the reusable workflow. Each holds the packaged `.tgz`.
      - name: Download the packaged charts
        if: needs.plan.outputs.charts != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chart-*
          merge-multiple: true
          path: .cr-release-packages

      # A workflow artifact can be replaced by any job in this run, so its
      # bytes alone prove nothing. This step instead checks the attestation
      # that the reusable workflow attached to each chart file: the
      # attestation is signed by that workflow's own OIDC token, naming this
      # repository and this commit, and no other job can forge it.
      - name: Verify the provenance of the packaged charts
        if: needs.plan.outputs.charts != '[]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tgz in .cr-release-packages/*.tgz; do
            gh attestation verify "$tgz" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/chart-release.yml" \
              --source-digest "${GITHUB_SHA}"
          done

      - name: Create GitHub releases and update index
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex

          OWNER=${{ github.repository_owner }}
          REPO=helm-charts
          PACKAGE_PATH=.cr-release-packages
          CR_TOKEN=${{ secrets.GITHUB_TOKEN }}

          # .cr-release-packages was filled by the reusable workflow
          if [ ! -d "${PACKAGE_PATH}" ] || [ -z "$(ls ${PACKAGE_PATH})" ]; then
            echo "No charts to release"
            exit 0
          fi

          # Sign the Hauler manifest, attached to the Kubewarden charts releases
          cosign sign-blob --yes ./charts/hauler_manifest.yaml --bundle hauler_manifest_cosign.bundle

          # The repository has immutable releases enabled: assets cannot be
          # added once a release is published. `gh release create` with
          # assets creates a draft, uploads the assets, and only then
          # publishes the release (or deletes the draft on failure).
          # Use `gh` instead of `cr upload`, as the latter cannot attach
          # extra assets (https://github.com/helm/chart-releaser/pull/587).
          for chart_path in "${PACKAGE_PATH}"/*.tgz; do
            chart_name=$(helm show chart "$chart_path" | yq -r '.name')
            chart_version=$(helm show chart "$chart_path" | yq -r '.version')
            release_name=${chart_name}-${chart_version}

            # Same release notes as `cr upload`: the chart description.
            # `--generate-notes` appends the list of merged pull requests.
            notes_file=$(mktemp)
            helm show chart "$chart_path" | yq -r '.description' > "$notes_file"

            assets=("$chart_path")
            if [[ "$chart_name" == @(kubewarden*|admission-controller) ]]; then
              assets+=(./charts/hauler_manifest.yaml hauler_manifest_cosign.bundle)
            fi

            # A previous run may have published this release already and
            # failed later: releases are immutable, so skip creation and only
            # redo the indexing.
            if gh --repo ${OWNER}/${REPO} release view "$release_name" >/dev/null 2>&1; then
              echo "Release $release_name already exists. Skipping creation."
              continue
            fi

            gh release create "$release_name" "${assets[@]}" \
              --repo ${OWNER}/${REPO} \
              --title "$release_name" \
              --notes-file "$notes_file" \
              --generate-notes \
              --target "$(git rev-parse HEAD)" \
              --latest=false
          done
          echo "Charts released!"

          # Reindex the repository
          cr index -o ${OWNER} -r ${REPO} --push --token ${CR_TOKEN} --index-path .
          echo "Repository indexed!"

      - name: Prepare GH pages readme & artifacthub-repo.yml
        run: |
          mkdir -p ./to-gh-pages
          cp -f charts/README.md ./to-gh-pages/
          cp -f artifacthub-repo.yml ./to-gh-pages/

      # This must run after `cr index --push`. That command reads the push
      # URL with `git remote get-url --push`, which applies `insteadOf`, and
      # then adds its own token. With the rewrite active, the URL gets two
      # sets of credentials and git rejects it.
      - name: Configure Git credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Clone existing gh-pages branch and commit
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-worktree gh-pages
          cp -r ./to-gh-pages/* gh-pages-worktree/
          cd gh-pages-worktree
          git add .
          git commit -m "Update GitHub Pages content" || echo "No changes to commit"
          git push origin gh-pages
